<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скрытый Стригун</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #17212b);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #708499);
      --btn: var(--tg-theme-button-color, #5288c1);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .header {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }
    .hint {
      font-size: 13px;
      color: var(--hint);
      margin-bottom: 14px;
      text-align: center;
    }
    textarea {
      width: 100%;
      max-width: 440px;
      height: 90px;
      background: var(--secondary-bg);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      resize: none;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: var(--btn);
    }
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 440px;
      margin-top: 12px;
    }
    .btn {
      flex: 1;
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .result-card {
      width: 100%;
      max-width: 440px;
      background: var(--secondary-bg);
      border-radius: 12px;
      padding: 14px;
      margin-top: 16px;
      box-sizing: border-box;
      display: none;
      border-left: 4px solid #4fa955;
    }
    .result-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4fa955;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .result-content {
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
      user-select: text;
    }
    .error-card {
      border-left-color: #e53935;
      color: #ff8a80;
    }
  </style>
</head>
<body>
  <div class="header" id="statusHeader">Загрузка...</div>
  <div class="hint" id="statusHint"></div>

  <textarea id="pasteBox" placeholder="Вставьте скопированный текст сюда (Ctrl+V)..." style="display: none;"></textarea>

  <div class="btn-row" id="btnContainer" style="display: none;">
    <button class="btn" id="pasteBtn">📋 Вставить из буфера</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-title" id="resultLabel">Расшифровано</div>
    <div class="result-content" id="resultText"></div>
    <button class="btn btn-secondary" id="copyResultBtn" style="margin-top: 12px; width: 100%;">Скопировать секрет</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const DEFAULT_KEY = "striguny_secret_2026";
    const ZW_START = "\u200D";
    const ZW_END = "\u200E";
    const ZW_BIT_0 = "\u200B";
    const ZW_BIT_1 = "\u200C";

    function decodeB64(str) {
      return decodeURIComponent(
        atob(str)
          .split('')
          .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
          .join('')
      );
    }

    async function generateKeystream(keyStr, length) {
      const encoder = new TextEncoder();
      const keyBytes = encoder.encode(keyStr);
      let keystream = new Uint8Array(length);
      let counter = 0;
      let offset = 0;

      while (offset < length) {
        const counterBytes = new Uint8Array(4);
        new DataView(counterBytes.buffer).setUint32(0, counter, false);

        const data = new Uint8Array(keyBytes.length + 4);
        data.set(keyBytes);
        data.set(counterBytes, keyBytes.length);

        const hashBuffer = await crypto.subtle.digest("SHA-256", data);
        const hashBytes = new Uint8Array(hashBuffer);

        const toCopy = Math.min(hashBytes.length, length - offset);
        keystream.set(hashBytes.subarray(0, toCopy), offset);
        offset += toCopy;
        counter++;
      }
      return keystream;
    }

    async function decompressZlib(compressed) {
      try {
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate"));
        return await new Response(stream).text();
      } catch (e1) {
        // Fallback: распаковка сырого deflate без 2 байт заголовка и 4 байт adler32
        const raw = compressed.subarray(2, compressed.length - 4);
        const streamRaw = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return await new Response(streamRaw).text();
      }
    }

    async function decryptPayload(payloadBytes, key) {
      if (payloadBytes.length < 5) throw new Error("Слишком короткий контейнер.");
      const salt = payloadBytes.subarray(0, 4);
      const saltHex = Array.from(salt).map(b => b.toString(16).padStart(2, '0')).join('');
      const encrypted = payloadBytes.subarray(4);
      const sessionKey = key + saltHex;

      const stream = await generateKeystream(sessionKey, encrypted.length);
      const compressed = new Uint8Array(encrypted.length);
      for (let i = 0; i < encrypted.length; i++) {
        compressed[i] = encrypted[i] ^ stream[i];
      }

      return await decompressZlib(compressed);
    }

    function zwToBytes(zwString) {
      const pattern = new RegExp(ZW_START + "([" + ZW_BIT_0 + ZW_BIT_1 + "]+)" + ZW_END);
      const match = zwString.match(pattern);
      if (!match) throw new Error("В тексте не найден скрытый контейнер Стригунов.");

      const rawBits = match[1];
      const bytes = [];
      for (let i = 0; i < rawBits.length; i += 8) {
        let byteStr = "";
        for (let j = 0; j < 8; j++) {
          byteStr += (rawBits[i + j] === ZW_BIT_1 ? "1" : "0");
        }
        bytes.push(parseInt(byteStr, 2));
      }
      return new Uint8Array(bytes);
    }

    const params = new URLSearchParams(window.location.search);
    const encData = params.get("d");

    const statusHeader = document.getElementById("statusHeader");
    const statusHint = document.getElementById("statusHint");
    const pasteBox = document.getElementById("pasteBox");
    const btnContainer = document.getElementById("btnContainer");
    const pasteBtn = document.getElementById("pasteBtn");
    const resultCard = document.getElementById("resultCard");
    const resultText = document.getElementById("resultText");
    const resultLabel = document.getElementById("resultLabel");
    const copyResultBtn = document.getElementById("copyResultBtn");

    async function init() {
      // РЕЖИМ 1: КОПИРОВАНИЕ ЗАШИФРОВАННОГО СООБЩЕНИЯ
      if (encData) {
        statusHeader.innerText = "Копирование в буфер...";
        try {
          const textToCopy = decodeB64(encData);
          await navigator.clipboard.writeText(textToCopy);
          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
          statusHeader.innerText = "Скопировано жирным шрифтом!";
          statusHint.innerText = "Вставьте в чат от своего имени";
          setTimeout(() => tg.close(), 500);
        } catch {
          statusHeader.innerText = "Нажмите кнопку для копирования:";
          btnContainer.style.display = "flex";
          pasteBtn.innerText = "📋 Скопировать текст";
          pasteBtn.onclick = async () => {
            await navigator.clipboard.writeText(decodeB64(encData));
            tg.close();
          };
        }
        return;
      }

      // РЕЖИМ 2: ДЕШИФРОВКА
      statusHeader.innerText = "Расшифровка сообщения";
      statusHint.innerText = "Вставьте скопированную фразу в поле ниже:";
      pasteBox.style.display = "block";
      btnContainer.style.display = "flex";

      setTimeout(() => pasteBox.focus(), 150);

      async function processText(text) {
        if (!text || !text.trim()) return;
        try {
          const bytes = zwToBytes(text);
          const decrypted = await decryptPayload(bytes, DEFAULT_KEY);

          resultCard.style.display = "block";
          resultCard.classList.remove("error-card");
          resultLabel.innerText = "Секретное сообщение:";
          resultText.innerText = decrypted;
          copyResultBtn.style.display = "block";

          copyResultBtn.onclick = async () => {
            await navigator.clipboard.writeText(decrypted);
            copyResultBtn.innerText = "Скопировано!";
            setTimeout(() => { copyResultBtn.innerText = "Скопировать секрет"; }, 1500);
          };

          if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        } catch (err) {
          resultCard.style.display = "block";
          resultCard.classList.add("error-card");
          resultLabel.innerText = "Ошибка:";
          resultText.innerText = err.message;
          copyResultBtn.style.display = "none";
        }
      }

      // Авто-дешифровка при вставке или вводе текста в поле
      pasteBox.addEventListener("input", () => processText(pasteBox.value));
      pasteBox.addEventListener("paste", (e) => {
        const pasted = (e.clipboardData || window.clipboardData).getData('text');
        if (pasted) setTimeout(() => processText(pasted), 50);
      });

      // Обработка клика по кнопке «Вставить из буфера»
      pasteBtn.onclick = async () => {
        let textFound = false;

        // Попытка через Telegram WebApp API
        if (tg.readTextFromClipboard) {
          tg.readTextFromClipboard(clipText => {
            if (clipText) {
              pasteBox.value = clipText;
              processText(clipText);
              textFound = true;
            }
          });
        }

        // Попытка через браузерный Clipboard API
        if (!textFound && navigator.clipboard && navigator.clipboard.readText) {
          try {
            const clipText = await navigator.clipboard.readText();
            if (clipText) {
              pasteBox.value = clipText;
              processText(clipText);
              textFound = true;
            }
          } catch {}
        }

        // Если Telegram заблокировал доступ к буферу
        if (!textFound) {
          pasteBox.focus();
          statusHint.innerText = "Буфер заблокирован клиентом — нажмите Ctrl+V в поле!";
          pasteBox.style.borderColor = "#e53935";
          setTimeout(() => { pasteBox.style.borderColor = ""; }, 1500);
        }
      };
    }

    init();
  </script>
</body>
</html>
